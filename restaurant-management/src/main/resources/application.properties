spring.application.name=restaurant-management

# Database credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA: update is convenient for local development; use Flyway/Liquibase migrations in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# Server
server.port=${PORT:8080}

# JWT: required; configure a cryptographically random secret (at least 32 bytes).
app.security.jwt-secret=${JWT_SECRET}

# Customer payment proof uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Comma-separated browser origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}
